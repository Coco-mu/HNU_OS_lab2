<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288"><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="288" fill="#FFFFFF"/><text x="78" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit7</text><rect x="40" y="40" width="76" height="46" rx="6" fill="#E7F4EA" stroke="#2E7D4F" stroke-width="2"/><text x="78" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">TXFE</text><text x="164" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit6</text><rect x="126" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="164" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">CTS</text><text x="250" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit5</text><rect x="212" y="40" width="76" height="46" rx="6" fill="#FCE9E9" stroke="#C0392B" stroke-width="2"/><text x="250" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">TXFF</text><text x="336" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit4</text><rect x="298" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="336" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">RXFE</text><text x="422" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit3</text><rect x="384" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="422" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">BUSY</text><text x="508" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit2</text><rect x="470" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="508" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">DCD</text><text x="594" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit1</text><rect x="556" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="594" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">DSR</text><text x="680" y="26" font-size="12.5" fill="#5A6672" text-anchor="middle">bit0</text><rect x="642" y="40" width="76" height="46" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="680" y="69" font-size="13.5" fill="#1B1B1B" font-weight="600" text-anchor="middle">RI</text><text x="380" y="114" font-size="13" fill="#5A6672" text-anchor="middle">UARTFR（0x18）低 8 位</text><rect x="40" y="130" width="680" height="52" rx="6" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.2"/><text x="56" y="151" font-size="12.5" fill="#5A6672">作业 1 的写法</text><text x="56" y="172" font-size="13" fill="#1B1B1B" font-family="'SF Mono',Menlo,Consolas,monospace">return ((fr &amp; DW_UART_TXFE) == 0U);  // 非空 → 继续等</text><rect x="40" y="192" width="680" height="52" rx="6" fill="#F7F9FB" stroke="#9AA7B4" stroke-width="1.2"/><text x="56" y="213" font-size="12.5" fill="#5A6672">基础版的写法</text><text x="56" y="234" font-size="13" fill="#1B1B1B" font-family="'SF Mono',Menlo,Consolas,monospace">return ((fr &amp; DW_UART_TXFF) != 0U);  // FIFO 满 → 继续等</text><text x="40" y="268" font-size="12.5" fill="#5A6672">TXFE 为 1 表示 FIFO 空、可以写；TXFF 为 1 表示 FIFO 满、要继续等。</text></g></svg>