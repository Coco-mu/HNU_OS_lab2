<svg xmlns="http://www.w3.org/2000/svg" width="760" height="494" viewBox="0 0 760 494"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="760" height="494" fill="#FFFFFF"/><rect x="20" y="22" width="4" height="17" fill="#1F5FA8"/><text x="31" y="36" font-size="17" fill="#1B1B1B" font-weight="600">PRT_Printf 到 UARTDR 的完整调用链</text><text x="31" y="56" font-size="12.5" fill="#5A6672">一次格式化输出，从函数调用一路走到串口寄存器</text><line x1="20" y1="68" x2="740" y2="68" stroke="#D5DBE2" stroke-width="1"/><rect x="46" y="88" width="306" height="60" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="61" y="113" font-size="16" fill="#1B1B1B" font-weight="600">PRT_Printf(fmt, ...)</text><text x="61" y="134" font-size="13" fill="#5A6672">入口：收格式串和参数</text><line x1="199" y1="148" x2="199" y2="166" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="46" y="168" width="306" height="60" rx="7" fill="#FFF6E5" stroke="#1F5FA8" stroke-width="1.4"/><text x="61" y="193" font-size="16" fill="#1B1B1B" font-weight="600">TryPrintf</text><text x="61" y="214" font-size="13" fill="#5A6672">准备 512 字节缓冲区</text><line x1="199" y1="228" x2="199" y2="246" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="46" y="248" width="306" height="60" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="61" y="273" font-size="16" fill="#1B1B1B" font-weight="600">vsnprintf_s(buf, fmt, ap)</text><text x="61" y="294" font-size="13" fill="#5A6672">按 %d %s %x 拼字符串</text><line x1="199" y1="308" x2="199" y2="326" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="46" y="328" width="306" height="60" rx="7" fill="#EAF2FB" stroke="#1F5FA8" stroke-width="1.4"/><text x="61" y="353" font-size="16" fill="#1B1B1B" font-weight="600">TryPutc(ch)</text><text x="61" y="374" font-size="13" fill="#5A6672">逐字符送出，换行补回车</text><rect x="404" y="88" width="306" height="60" rx="7" fill="#FFF6E5" stroke="#1F5FA8" stroke-width="1.4"/><text x="419" y="113" font-size="16" fill="#1B1B1B" font-weight="600">uart_poll_send(ch)</text><text x="419" y="134" font-size="13" fill="#5A6672">轮询等待，直到能发</text><line x1="557" y1="148" x2="557" y2="166" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="404" y="168" width="306" height="60" rx="7" fill="#E7F4EA" stroke="#1F5FA8" stroke-width="1.4"/><text x="419" y="193" font-size="16" fill="#1B1B1B" font-weight="600">uart_is_txfifo_full</text><text x="419" y="214" font-size="13" fill="#5A6672">读 UARTFR，取 TXFF 位</text><line x1="557" y1="228" x2="557" y2="246" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="404" y="248" width="306" height="60" rx="7" fill="#1F5FA8" stroke="#1F5FA8" stroke-width="1.4"/><text x="419" y="273" font-size="16" fill="#FFFFFF" font-weight="600">写 UARTDR（0x09000000）</text><text x="419" y="294" font-size="13" fill="#D8E6F6">字节进发送器，串口打出</text><polyline points="352,358 378,358 378,118 402,118" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="412" width="720" height="64" rx="7" fill="#F7F9FB" stroke="#D5DBE2" stroke-width="1"/><text x="38" y="438" font-size="13" fill="#2D3748">基础版：开 FIFO，等 TXFF（bit5）清零再写 UARTDR。</text><text x="38" y="461" font-size="13" fill="#2D3748">作业 1：关 FIFO，改等 TXFE（bit7）置 1 再写。两版只差这一个判据。</text></g></svg>